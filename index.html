<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="OKX 2025 Year in Review — your trading blueprint, decoded by your agent." />
  <title>OKX · Trading Blueprint 2025</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles.css" />
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
  <canvas id="ascii" aria-hidden="true"></canvas>
  <canvas id="gl" aria-hidden="true"></canvas>

  <div class="app" id="app" data-phase="entry">
    <header class="topbar">
      <div class="brand">
        <div class="wordmark">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span>OKX</span>
          <small id="brandSub"></small>
        </div>
        <button class="lang" id="langBtn" type="button" aria-label="Switch language"></button>
      </div>
      <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0"></div>
    </header>

    <main class="stage" id="stage">
      <div class="scene-host" id="sceneHost"></div>
    </main>

    <button class="next" id="next" type="button">
      <span id="nextLabel"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle class="ring-bg" cx="12" cy="12" r="9" fill="none" stroke-width="2"></circle>
        <circle class="ring-fg" id="nextRing" cx="12" cy="12" r="9" fill="none" stroke-width="2"></circle>
        <path d="M10 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>

    <section class="console" id="console">
      <div class="cover" id="cover">
        <div class="eyebrow" id="coverEyebrow"></div>
        <h1 id="coverTitle"></h1>
        <p id="coverSub"></p>
        <div class="hint" id="coverHint"></div>
      </div>
      <div class="thread" id="thread" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="slash" id="slash" hidden></div>
        <div class="composer-main" id="composerMain">
          <div class="composer-box" id="composerBox">
            <div class="chips" id="chips"></div>
            <input id="composerInput" type="text" enterkeyhint="send" spellcheck="false" />
            <button class="send" id="send" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19V5m0 0l-6 6m6-6l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="composer-tools">
            <button class="tool-btn" id="slashBtn" type="button"><span>/</span> <span id="slashBtnLabel"></span></button>
            <span class="status" id="status"></span>
          </div>
        </div>
        <div class="strip" id="strip">
          <span class="status" id="stripStatus"></span>
          <span class="strip-right">
            <span class="chip small" id="stripChip"></span>
            <button class="ask" id="stripAsk" type="button" hidden></button>
          </span>
        </div>
      </form>
    </section>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-body">
      <img id="sheetImg" alt="Persona card" />
      <div class="sheet-actions">
        <span id="sheetHint"></span>
        <a id="sheetDl" class="btn primary" download="okx-2025-blueprint.png">PNG</a>
        <button id="sheetClose" class="btn" type="button"></button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
